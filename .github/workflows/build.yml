name: Build APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew tasks | grep -i assemble
          ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exhxx78-vpn
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
